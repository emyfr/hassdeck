<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accesso — Streamdeck HA Bridge</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --border: #e0e0e2;
    --ok: #1e8e3e;
    --err: #c5221f;
    --accent: #0a66ff;
    --input-bg: #f0f0f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card-bg: #232427;
      --text: #f0f0f2;
      --muted: #9a9aa0;
      --border: #3a3b3e;
      --ok: #3ddc73;
      --err: #ff6b64;
      --accent: #4c8dff;
      --input-bg: #2c2d31;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 4rem 1rem;
  }
  main {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  h1 { font-size: 1.4rem; margin: 0; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.3rem 1.4rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  label {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  input[type="password"] {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.55rem 0.7rem;
    color: var(--text);
    font-size: 0.95rem;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .status-line {
    font-size: 0.85rem;
    color: var(--muted);
    min-height: 1.2em;
  }
  .status-line.err { color: var(--err); }
  .hint { color: var(--muted); font-size: 0.8rem; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Streamdeck HA Bridge</h1>

  <form class="card" id="login-form" hidden>
    <label>
      Password
      <input type="password" id="login-password" autocomplete="current-password" required autofocus>
    </label>
    <button type="submit">Accedi</button>
    <div class="status-line" id="login-status"></div>
  </form>

  <form class="card" id="setup-form" hidden>
    <p class="hint">Primo accesso: scegli la password per proteggere l'interfaccia di configurazione (almeno 8 caratteri).</p>
    <label>
      Nuova password
      <input type="password" id="setup-password" autocomplete="new-password" minlength="8" required>
    </label>
    <label>
      Ripeti password
      <input type="password" id="setup-confirm" autocomplete="new-password" minlength="8" required>
    </label>
    <button type="submit">Crea password</button>
    <div class="status-line" id="setup-status"></div>
  </form>
</main>

<script>
function setStatus(el, text, kind) {
  el.textContent = text;
  el.className = "status-line" + (kind ? " " + kind : "");
}

async function submitPassword(url, password, statusEl, button) {
  button.disabled = true;
  setStatus(statusEl, "attendere…");
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    if (!res.ok) throw new Error(await res.text());
    location.href = "/";
  } catch (err) {
    setStatus(statusEl, err.message, "err");
    button.disabled = false;
  }
}

const loginForm = document.getElementById("login-form");
const setupForm = document.getElementById("setup-form");

loginForm.addEventListener("submit", (e) => {
  e.preventDefault();
  submitPassword(
    "/api/auth/login",
    document.getElementById("login-password").value,
    document.getElementById("login-status"),
    loginForm.querySelector("button"),
  );
});

setupForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const password = document.getElementById("setup-password").value;
  const statusEl = document.getElementById("setup-status");
  if (password !== document.getElementById("setup-confirm").value) {
    setStatus(statusEl, "le due password non coincidono", "err");
    return;
  }
  submitPassword("/api/auth/setup", password, statusEl, setupForm.querySelector("button"));
});

async function init() {
  const res = await fetch("/api/auth/status");
  const status = await res.json();
  if (status.password_set) {
    loginForm.hidden = false;
    document.getElementById("login-password").focus();
  } else {
    setupForm.hidden = false;
    document.getElementById("setup-password").focus();
  }
}

init();
</script>
</body>
</html>
