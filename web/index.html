<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streamdeck HA Bridge</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --border: #e0e0e2;
    --ok: #1e8e3e;
    --err: #c5221f;
    --key-off: #e4e4e7;
    --key-off-text: #8a8a90;
    --key-on: #ffd54a;
    --key-on-text: #3a2c00;
    --bar-off: #d6d6da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card-bg: #232427;
      --text: #f0f0f2;
      --muted: #9a9aa0;
      --border: #3a3b3e;
      --ok: #3ddc73;
      --err: #ff6b64;
      --key-off: #2d2e32;
      --key-off-text: #6c6d72;
      --key-on: #ffd54a;
      --key-on-text: #3a2c00;
      --bar-off: #303136;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 2.5rem 1rem;
  }
  main {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 0.5rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem 1.4rem;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .label { color: var(--muted); font-size: 0.9rem; }
  .value { font-weight: 600; text-align: right; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .badge.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .badge.err { background: color-mix(in srgb, var(--err) 18%, transparent); color: var(--err); }
  .muted { color: var(--muted); }

  .deck {
    display: flex;
    align-items: stretch;
    gap: 10px;
  }
  .keys-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .key {
    position: relative;
    aspect-ratio: 1;
    border-radius: 10px;
    background: var(--key-off);
    background-size: cover;
    background-position: center;
    color: var(--key-off-text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    font-weight: 600;
    transition: background 120ms ease, color 120ms ease, box-shadow 120ms ease, transform 80ms ease;
    user-select: none;
    cursor: pointer;
  }
  .key:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--muted) 40%, transparent); }
  .key.pending { opacity: 0.7; pointer-events: none; }
  .key.has-icon .key-label { display: none; }
  .key .key-badge {
    display: none;
    position: absolute;
    bottom: 3px;
    right: 4px;
    font-size: 0.6rem;
    font-weight: 700;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    padding: 0 4px;
    border-radius: 4px;
    line-height: 1.3;
  }
  .key.has-icon .key-badge { display: block; }
  .key.pressed {
    background: var(--key-on);
    color: var(--key-on-text);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--key-on) 45%, transparent);
    transform: scale(0.94);
  }
  .key.flash-ok {
    box-shadow: 0 0 0 3px var(--ok);
  }
  .key.flash-err {
    box-shadow: 0 0 0 3px var(--err);
  }
  .bar {
    width: 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bar-segment {
    flex: 1;
    border-radius: 6px;
    background: var(--bar-off);
  }
  .deck-caption {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 0.6rem;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<main>
  <nav style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:0.5rem;">
    <h1>Streamdeck HA Bridge</h1>
    <div style="display:flex; gap:1rem;">
      <a href="/configura" style="color: var(--muted); font-size: 0.9rem;">Configura</a>
      <a href="/impostazioni" style="color: var(--muted); font-size: 0.9rem;">Impostazioni</a>
    </div>
  </nav>

  <div class="card">
    <div class="row">
      <span class="label">Connessione al deck</span>
      <span class="value" id="connected">—</span>
    </div>
    <div class="row">
      <span class="label">Serial number</span>
      <span class="value" id="serial">—</span>
    </div>
    <div class="row">
      <span class="label">Ultima azione</span>
      <span class="value" id="last-action">—</span>
    </div>
  </div>

  <div class="card">
    <div class="deck">
      <div class="keys-grid" id="keys-grid"></div>
      <div class="bar">
        <div class="bar-segment"></div>
        <div class="bar-segment"></div>
        <div class="bar-segment"></div>
      </div>
    </div>
    <div class="deck-caption">clicca un tasto per attivarlo da qui — barra verticale solo display, non interattiva</div>
  </div>

  <footer id="ws-status">connessione in corso…</footer>
</main>

<script>
const KEYS_GRID = document.getElementById("keys-grid");
const keyEls = {};
for (let k = 1; k <= 15; k++) {
  const el = document.createElement("div");
  el.className = "key";
  el.innerHTML = `<span class="key-label">${k}</span><span class="key-badge">${k}</span>`;
  el.addEventListener("click", () => pressKeyFromWeb(k));
  KEYS_GRID.appendChild(el);
  keyEls[k] = el;
}

async function pressKeyFromWeb(key) {
  const el = keyEls[key];
  if (el.classList.contains("pending")) return; // evita doppio invio da click ripetuti
  el.classList.add("pending");
  try {
    await fetch(`/api/keys/${key}/press`, { method: "POST" });
  } catch (e) {
    // il server aggiornera' comunque lo stato al prossimo refresh
  } finally {
    el.classList.remove("pending");
  }
}

async function refreshIcons() {
  try {
    const res = await fetch("/api/keys");
    const keys = await res.json();
    for (const k of keys) {
      const el = keyEls[k.key];
      if (!el) continue;
      if (k.icon) {
        el.style.backgroundImage = `url(/${k.icon}?t=${Date.now()})`;
        el.classList.add("has-icon");
      } else {
        el.style.backgroundImage = "";
        el.classList.remove("has-icon");
      }
    }
  } catch (e) {
    // silenzioso: la griglia resta con l'ultimo stato noto
  }
}

function timeAgo(unixSeconds) {
  if (!unixSeconds) return "";
  const diff = Math.max(0, Math.floor(Date.now() / 1000) - unixSeconds);
  if (diff < 5) return "adesso";
  if (diff < 60) return diff + "s fa";
  if (diff < 3600) return Math.floor(diff / 60) + "m fa";
  return Math.floor(diff / 3600) + "h fa";
}

async function refreshStatus() {
  try {
    const res = await fetch("/api/status");
    const status = await res.json();

    document.getElementById("connected").innerHTML = status.connected
      ? '<span class="badge ok">connesso</span>'
      : '<span class="badge err">disconnesso</span>';
    document.getElementById("serial").textContent = status.serial || "—";

    const lastActionEl = document.getElementById("last-action");
    if (status.last_action_result) {
      const a = status.last_action_result;
      const badge = a.success
        ? '<span class="badge ok">riuscita</span>'
        : '<span class="badge err">fallita</span>';
      lastActionEl.innerHTML = "Tasto " + a.physical_key + " " + badge +
        ' <span class="muted">(' + timeAgo(a.at_unix) + ")</span>";
    } else {
      lastActionEl.textContent = "—";
    }
  } catch (e) {
    document.getElementById("connected").innerHTML = '<span class="badge err">server non raggiungibile</span>';
  }
}

refreshStatus();
refreshIcons();
setInterval(refreshStatus, 3000);
setInterval(refreshIcons, 5000);

function connectWs() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(proto + "//" + location.host + "/ws");
  const wsStatusEl = document.getElementById("ws-status");

  ws.onopen = () => { wsStatusEl.textContent = "monitor in tempo reale attivo"; };
  ws.onclose = () => {
    wsStatusEl.textContent = "connessione persa, nuovo tentativo tra 2s…";
    setTimeout(connectWs, 2000);
  };
  ws.onerror = () => ws.close();

  const MIN_VISIBLE_MS = 180;
  const pressedAt = {};

  ws.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    const el = keyEls[event.physical_key];
    if (!el) return;

    if (event.type === "key") {
      if (event.pressed) {
        pressedAt[event.physical_key] = Date.now();
        el.classList.add("pressed");
      } else {
        // Garantisce una durata minima visibile anche per pressioni fisiche
        // rapidissime (altrimenti il flash dura troppo poco per essere notato).
        const elapsed = Date.now() - (pressedAt[event.physical_key] || 0);
        const wait = Math.max(0, MIN_VISIBLE_MS - elapsed);
        setTimeout(() => el.classList.remove("pressed"), wait);
      }
    } else if (event.type === "action_result") {
      const cls = event.success ? "flash-ok" : "flash-err";
      el.classList.add(cls);
      setTimeout(() => el.classList.remove(cls), 500);
      refreshStatus();
    }
  };
}

connectWs();
</script>
</body>
</html>
