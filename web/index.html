<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streamdeck HA Bridge</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --border: #e0e0e2;
    --ok: #1e8e3e;
    --err: #c5221f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card-bg: #232427;
      --text: #f0f0f2;
      --muted: #9a9aa0;
      --border: #3a3b3e;
      --ok: #3ddc73;
      --err: #ff6b64;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 2.5rem 1rem;
  }
  main {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 0.5rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem 1.4rem;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .label { color: var(--muted); font-size: 0.9rem; }
  .value { font-weight: 600; text-align: right; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .badge.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .badge.err { background: color-mix(in srgb, var(--err) 18%, transparent); color: var(--err); }
  .muted { color: var(--muted); }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<main>
  <h1>Streamdeck HA Bridge</h1>

  <div class="card">
    <div class="row">
      <span class="label">Connessione al deck</span>
      <span class="value" id="connected">—</span>
    </div>
    <div class="row">
      <span class="label">Serial number</span>
      <span class="value" id="serial">—</span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Ultimo tasto premuto</span>
      <span class="value" id="last-key">—</span>
    </div>
    <div class="row">
      <span class="label">Ultima azione</span>
      <span class="value" id="last-action">—</span>
    </div>
  </div>

  <footer>Aggiornato automaticamente ogni 2 secondi</footer>
</main>

<script>
function timeAgo(unixSeconds) {
  if (!unixSeconds) return "";
  const diff = Math.max(0, Math.floor(Date.now() / 1000) - unixSeconds);
  if (diff < 5) return "adesso";
  if (diff < 60) return diff + "s fa";
  if (diff < 3600) return Math.floor(diff / 60) + "m fa";
  return Math.floor(diff / 3600) + "h fa";
}

async function refresh() {
  try {
    const res = await fetch("/api/status");
    const status = await res.json();

    const connectedEl = document.getElementById("connected");
    connectedEl.innerHTML = status.connected
      ? '<span class="badge ok">connesso</span>'
      : '<span class="badge err">disconnesso</span>';

    document.getElementById("serial").textContent = status.serial || "—";

    const lastKeyEl = document.getElementById("last-key");
    if (status.last_key_press) {
      lastKeyEl.textContent = "Tasto " + status.last_key_press.physical_key +
        " (" + timeAgo(status.last_key_press.at_unix) + ")";
    } else {
      lastKeyEl.textContent = "—";
    }

    const lastActionEl = document.getElementById("last-action");
    if (status.last_action_result) {
      const a = status.last_action_result;
      const badge = a.success
        ? '<span class="badge ok">riuscita</span>'
        : '<span class="badge err">fallita</span>';
      lastActionEl.innerHTML = "Tasto " + a.physical_key + " " + badge +
        ' <span class="muted">(' + timeAgo(a.at_unix) + ")</span>";
    } else {
      lastActionEl.textContent = "—";
    }
  } catch (e) {
    document.getElementById("connected").innerHTML = '<span class="badge err">server non raggiungibile</span>';
  }
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
